<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#7f00ff;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#00f2fe;#4facfe;#7f00ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#7f00ff;#00f2fe;#4facfe" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glow Orbs -->
    <radialGradient id="orb-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 2px;
      fill: url(#title-grad);
    }
    .sub-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 1px;
      fill: #cbd5e1;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .badge-top-text {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="256" rx="16" ry="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Background Orbs -->
  <rect x="2" y="2" width="896" height="256" rx="16" ry="16" fill="url(#orb-left)" />
  <rect x="2" y="2" width="896" height="256" rx="16" ry="16" fill="url(#orb-right)" />

  <!-- Dot Grid Overlay -->
  <rect x="2" y="2" width="896" height="256" rx="16" ry="16" fill="url(#dot-grid)" />

  <!-- Top Micro-Badge -->
  <g transform="translate(340, 26)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="16" text-anchor="middle" class="badge-top-text">✦ SOFTWARE CRAFTSMAN ✦</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="105" text-anchor="middle" class="title-text" filter="url(#glow)">AVIRAL TRIVEDI</text>

  <!-- Subtitle -->
  <text x="450" y="145" text-anchor="middle" class="sub-text">Full Stack Web Architect &amp; AI Systems Engineer</text>

  <!-- Horizontal Tech Divider -->
  <line x1="280" y1="168" x2="620" y2="168" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Floating Tags -->
  <!-- Tag 1 -->
  <g transform="translate(140, 188)">
    <rect x="0" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="67" y="21" text-anchor="middle" class="tag-text" fill="#7dd3fc">🚀 Full Stack</text>
  </g>

  <!-- Tag 2 -->
  <g transform="translate(295, 188)">
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="70" y="21" text-anchor="middle" class="tag-text" fill="#d8b4fe">🤖 AI &amp; Vision</text>
  </g>

  <!-- Tag 3 -->
  <g transform="translate(455, 188)">
    <rect x="0" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="72" y="21" text-anchor="middle" class="tag-text" fill="#93c5fd">☁️ Cloud &amp; DevOps</text>
  </g>

  <!-- Tag 4 -->
  <g transform="translate(620, 188)">
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="70" y="21" text-anchor="middle" class="tag-text" fill="#6ee7b7">⚡ Open Source</text>
  </g>
</svg>
