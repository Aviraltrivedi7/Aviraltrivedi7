<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#7f00ff;#4facfe;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#4facfe;#00f2fe;#7f00ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#7f00ff;#4facfe" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="96" rx="14" ry="14" fill="url(#footer-grad)" stroke="url(#wave-grad)" stroke-width="1.5" />

  <!-- Animated Wave Shape -->
  <path d="M 2 60 Q 225 30, 450 60 T 898 60 L 898 98 L 2 98 Z" fill="url(#wave-grad)" opacity="0.15" />

  <!-- Footer Text -->
  <text x="450" y="46" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="1">
    ✦ THANKS FOR VISITING MY GITHUB PROFILE ✦
  </text>
  <text x="450" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Designed with passion for modern open-source craftsmanship
  </text>
</svg>
